# .github/workflows/update-cyber-data.yml
#
# Scheduled refresh of the Cyber Attack Earth data pack. No AI.
#
# CADENCE (since builder 3.19.0)
#   Nightly  02:17 UTC  fast-moving sources only: KEV, EPSS, CVE/NVD, CISA advisories,
#                       SEC filings, the last 3 months + current month of ransomware
#                       claims, and the hand-maintained files (CISSM export, EuRepoC
#                       TableView, impact overlay, estimates, reports).
#   Weekly   Sun 03:47  everything, including VCDB, ICS advisories, Have I Been Pwned,
#                       ATT&CK, a check for a new EuRepoC release on Zenodo and a full
#                       re-sweep of every ransomware month since 2020.
#   By hand  "Run workflow" button: a full run. Optional allow_shrink=<source id>
#                       accepts a real drop in rows that the shrink guard held back.
# Sources not scheduled on a run keep their previous data (the builder carries them
# forward), so the site never loses a layer because it was not refreshed that night.
# GitHub often starts scheduled runs late; that does not matter here.
#
# SAFETY
#   - Shrink guard: a source returning under 90% of last time is held back, its old
#     data kept, and a "data-guard" issue raised.
#   - The pack is checked (tests/test_pack.py) before anything is committed.
#   - The hand-downloaded exports raise a "data-refresh" issue once past 40 days.
#   - Kill switch: the switch job below. automation.json here or in
#     stuartokin.github.io with "paused": true stops scheduled runs.
#
# SECRETS (Settings > Secrets and variables > Actions). All optional:
#   CISSM_API_KEY   CISSM API key, once Dr Harry issues one (replaces the hand export)
#   NVD_API_KEY     free key from nvd.nist.gov, speeds up the CVE backfill
#   SEC_CONTACT     "Project name you@example.com" - SEC refuses requests without a
#                   contact email in the User-Agent. A secret so the address is not public.
# GITHUB_TOKEN is provided by Actions itself; it is used only to raise and close the
# reminder issues. Never put credentials in this file or the builder: the repo is public.
name: Update cyber data pack

on:
  schedule:
    - cron: "17 2 * * *"      # nightly (fast sources)
    - cron: "47 3 * * 0"      # weekly, Sunday (everything)
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Source ids allowed to shrink this run, comma-separated (normally blank)"
        required: false
        default: ""

permissions:
  contents: write             # required for the commit step to push
  issues: write               # reminder and data-guard issues

concurrency:
  group: update-cyber-data
  cancel-in-progress: false   # never kill a run half way through writing the pack

jobs:
  # ---- Kill switch -------------------------------------------------------
  # Reads two small files before anything else runs:
  #   master: stuartokin.github.io/automation.json  (turns off every app)
  #   local:  automation.json at the top of this repo (turns off this app)
  # If either says "paused": true, automatic runs (schedule, issues,
  # comments, other workflows) stop here and change nothing. Runs started by
  # hand ("Run workflow") and your own uploads always go ahead.
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        name: Check the kill switches
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          flag() {
            local v
            v=$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "$1?t=$(date +%s)" 2>/dev/null | jq -r '.paused' 2>/dev/null) || v=""
            case "$v" in true|false) echo "$v" ;; null) echo false ;; *) echo unknown ;; esac
          }
          MASTER=$(flag "https://raw.githubusercontent.com/stuartokin/stuartokin.github.io/main/automation.json")
          LOCAL=$(flag "https://raw.githubusercontent.com/$REPO/$SHA/automation.json")
          echo "Master switch (stuartokin.github.io/automation.json): paused = $MASTER"
          echo "This repo's switch (automation.json): paused = $LOCAL"
          GO=true
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "push" ]; then
            if [ "$MASTER" = "true" ] || [ "$LOCAL" = "true" ]; then
              echo "::notice title=Kill switch::A switch is set to paused, but this run was started by hand or by an upload, so it goes ahead."
            fi
          elif [ "$MASTER" = "true" ]; then
            GO=false
            echo "::notice title=Kill switch::Paused by master switch (stuartokin.github.io/automation.json). Nothing was changed."
          elif [ "$LOCAL" = "true" ]; then
            GO=false
            echo "::notice title=Kill switch::Paused by this repo's switch (automation.json). Nothing was changed."
          fi
          if [ "$MASTER" = "unknown" ]; then
            echo "::warning title=Kill switch::Could not read the master switch, so carrying on as normal."
          fi
          echo "go=$GO" >> "$GITHUB_OUTPUT"
          echo "Kill switch: master paused = $MASTER, this repo paused = $LOCAL, event = $EVENT, go = $GO" >> "$GITHUB_STEP_SUMMARY"

  refresh:
    needs: switch
    if: needs.switch.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45       # a stuck source can no longer hold the runner for 6 hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide what this run refreshes
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
        run: |
          NIGHTLY="kev,epss,rwlive,cve,nvdcve,cisaaa,secedgar,cissm,eurepoc_live,impact_overlay,estimates,reports"
          if [ "$EVENT" = "schedule" ] && [ "$SCHED" = "17 2 * * *" ]; then
            echo "kind=nightly" >> "$GITHUB_OUTPUT"
            echo "only=$NIGHTLY" >> "$GITHUB_OUTPUT"
            echo "full_rw=" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "schedule" ]; then
            echo "kind=weekly" >> "$GITHUB_OUTPUT"
            echo "only=" >> "$GITHUB_OUTPUT"
            echo "full_rw=1" >> "$GITHUB_OUTPUT"
          else
            echo "kind=manual" >> "$GITHUB_OUTPUT"
            echo "only=" >> "$GITHUB_OUTPUT"
            echo "full_rw=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Show what we are about to run
        run: |
          echo "Run kind: ${{ steps.plan.outputs.kind }}   sources: ${{ steps.plan.outputs.only || 'all' }}"
          echo "build_cyber_data.py last modified: $(git log -1 --format=%ci -- build_cyber_data.py 2>/dev/null || echo 'not tracked')"
          if [ -f cyber_data/manifest.json ]; then
            python3 -c "import json;m=json.load(open('cyber_data/manifest.json'));print('pack before this run: builder',m.get('builder'),'generated',m.get('generated'))"
          fi

      - name: Build data pack
        env:
          CISSM_API_KEY: ${{ secrets.CISSM_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ONLY_SOURCES: ${{ steps.plan.outputs.only }}
          RWLIVE_FULL: ${{ steps.plan.outputs.full_rw }}
          BUILD_KIND: ${{ steps.plan.outputs.kind }}
          ALLOW_SHRINK: ${{ github.event.inputs.allow_shrink }}
        run: |
          pip install requests
          python3 build_cyber_data.py cyber_data

      - name: Check the pack before committing
        run: |
          python3 tests/test_pack.py
          python3 tests/test_curated.py
          python3 tests/test_builder.py

      - name: Show what changed
        run: |
          python3 -c "import json;m=json.load(open('cyber_data/manifest.json'));[print(' ',s['id'].ljust(15),str(s['status'])[:60],s.get('rows'),'/ expected',s.get('expected')) for s in m.get('sources',[])]"
          echo "--- files changed ---"
          git status --porcelain cyber_data manual_sources | head -40
          echo "(total: $(git status --porcelain cyber_data manual_sources | wc -l))"

      - name: Commit and push
        run: |
          git config user.name "data-pack-bot"
          git config user.email "actions@users.noreply.github.com"
          # The SEC review queue lives outside cyber_data and is rewritten by the
          # build; decisions already recorded in it are preserved by the builder.
          git add cyber_data manual_sources/sec_review.csv 2>/dev/null || git add cyber_data
          if git diff --cached --quiet; then
            echo "Nothing changed - no commit."
            exit 0
          fi
          git commit -m "Refresh cyber data pack ($(date -u +%F), ${{ steps.plan.outputs.kind }})"
          # Someone may have pushed while the build ran; replay on top rather than fail.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && { echo "Pushed $(git rev-parse --short HEAD)"; exit 0; }
            echo "Push attempt $i failed; retrying in 15s"; sleep 15
          done
          echo "::error::Could not push the refreshed pack after 3 attempts."
          exit 1
